[package]
name = "seer-pc-updater"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[[bin]]
name = "updater"
path = "src/main.rs"

[dependencies]
discord-presence = "3.2.0"
hex = "0.4.3"
md-5 = "0.11.0"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
zip = "8.6.0"


[build-dependencies]
winres = "0.1.12"
