name: Build and Release Updater

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build updater.exe
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build updater.exe
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Verify updater.exe
        shell: pwsh
        run: |
          $file = "target\x86_64-pc-windows-msvc\release\updater.exe"

          if (!(Test-Path $file)) {
            Write-Error "updater.exe not found!"
            exit 1
          }

          Write-Host "Build successful:"
          Get-Item $file | Format-List Name, Length, FullName

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/x86_64-pc-windows-msvc/release/updater.exe
          generate_release_notes: true
